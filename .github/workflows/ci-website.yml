# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "development" ]
    paths:
      - su-website/**
      - 'docker-compose.yml'
      - .github/workflows/ci-website.yml
  pull_request:
    branches: [ "development" ]
    paths:
      - su-website/**
      - 'docker-compose.yml'
      - .github/workflows/ci-website.yml

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [ 18, 20, 22 ]
    env:
      CI: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      - name: Enable core pack
        run: corepack enable

      - name: Install dependencies
        run: |
          cd su-website
          yarn install

      - name: Build website
        run: |
          cd su-website
          echo "Process.env.CI: $CI" 
          yarn build

  build-image:
    name: Build website Docker image
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Extract project version
        id: extract_version
        run: |
          cd su-website
          echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./su-website
          file: ./su-website/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ vars.DOCKERHUB_USERNAME }}/su-website:latest,
            ${{ vars.DOCKERHUB_USERNAME }}/su-website:${{ steps.extract_version.outputs.VERSION }}