spring:
  application:
    name: su-api

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database: postgresql
  datasource:
    url: jdbc:postgresql://localhost:5432/suc_db
    username: suc_user
    password: password
    driver-class-name: org.postgresql.Driver
  main:
    banner-mode: off

