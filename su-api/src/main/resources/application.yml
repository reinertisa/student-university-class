#    generate-unique-name: false
#    name: test
#    username: test
#  jpa:
#    show-sql: true

server:
  error:
    include-message: always
    include-binding-errors: always
  port: 8080
logging:
  level:
    root: warn
    org.hibernate.sql: trace
    org.hibernate.orm.jdbc.bind: trace
